name: Question
description: Ask a question about TrustPin React Native SDK usage
title: "[QUESTION] "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about using TrustPin? We're here to help! Please check our [documentation](https://github.com/trustpin-cloud/react-native.sdk) first.

  - type: dropdown
    id: question-type
    attributes:
      label: Question Type
      description: What type of question is this?
      options:
        - Setup/Configuration
        - Integration (fetch, Axios, etc.)
        - Error Handling
        - Best Practices
        - Performance
        - Security
        - Troubleshooting
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: Ask your question here...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any relevant context about your use case, setup, or what you've tried so far.
      placeholder: |
        I'm trying to...
        I've already tried...
        My setup includes...

  - type: input
    id: version
    attributes:
      label: TrustPin SDK Version
      description: What version of the TrustPin React Native SDK (`@trustpin/react-native`) are you using?
      placeholder: e.g., 6.2.0

  - type: dropdown
    id: setup
    attributes:
      label: Setup
      description: How is the SDK integrated into your app?
      options:
        - Expo (config plugin)
        - Bare React Native
        - Not applicable

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you working with?
      options:
        - iOS
        - Android
        - Both
        - Not platform-specific

  - type: textarea
    id: code-sample
    attributes:
      label: Relevant Code (Optional)
      description: If applicable, share relevant code snippets
      render: typescript

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have checked the documentation and README
          required: true
        - label: I have searched existing issues for similar questions
          required: true
